# Production stack for the single EC2 instance. Lives at /opt/binxportal on
# the box, alongside a `.env` file (not committed — see .env.prod.example)
# holding the real secrets.
#
# SAFETY: never run `docker compose -f docker-compose.prod.yml down -v` — the
# `-v` drops the named volumes below, which is the only copy of Redis data
# and Caddy's TLS certs. Deploys are always `pull` + `up -d` (see
# deploy/redeploy.sh); `down` (without `-v`) is fine for a full stack
# restart, since named volumes outlive `down`.
#
# The database isn't here: it's RDS (`binxportal-production`, see
# infra/lib/rds-stack.ts). It used to be a `db` service on this box —
# redeploy.sh moved its data across on the first deploy without it, and its
# old volume (binxportal_db-data) is left in place until removed by hand.
# Nor are uploads: they're in S3 (UPLOAD_BUCKET below). The `uploads` volume
# they were meant to use never held a file — the api couldn't write to it —
# so binxportal_uploads is empty and safe to `docker volume rm`.

name: binxportal

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No auth/port published — only reachable from other containers on this
    # compose network. Used today for rate-limit counters (core/rate_limit.py);
    # see AGENTS/SECURITY notes on modules/messaging/realtime.py for the
    # Redis pub/sub rework that would be needed if this ever scales past one
    # api instance.
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: ${API_IMAGE:?set in .env, e.g. <account>.dkr.ecr.<region>.amazonaws.com/binx-api:latest}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # Assembled into DATABASE_URL by binx_api/core/config.py; written to
      # .env by redeploy.sh from the binxportal/rds/production secret.
      # Deliberately `:-`, not `:?`: a staging deploy also parses this file
      # (to update the shared Caddy) against production's .env, which only
      # gets these once production itself has been deployed on RDS.
      # redeploy.sh refuses to deploy production without them.
      DATABASE_ENDPOINT: ${DATABASE_ENDPOINT:-}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_NAME: ${DATABASE_NAME:-}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      FRONTEND_URL: https://www.binxportal.com
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Optional integrations — each is cleanly off while its key is absent
      # from the binxportal/app secret (see binx_api/core/config.py). Listed
      # explicitly because a key in the secret only reaches `.env`; nothing
      # reaches this container unless it's named here.
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CONNECT_WEBHOOK_SECRET: ${STRIPE_CONNECT_WEBHOOK_SECRET:-}
      STRIPE_CONNECT_ACCOUNT_WEBHOOK_SECRET: ${STRIPE_CONNECT_ACCOUNT_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID_STARTER: ${STRIPE_PRICE_ID_STARTER:-}
      STRIPE_PRICE_ID_PRO: ${STRIPE_PRICE_ID_PRO:-}
      STRIPE_PRICE_ID_SCALE: ${STRIPE_PRICE_ID_SCALE:-}
      STRIPE_LAUNCH_DISCOUNT_COUPON_ID: ${STRIPE_LAUNCH_DISCOUNT_COUPON_ID:-}
      # Amazon SES — not a secret (just a verified sending address + the
      # region), so it's a plain literal here rather than routed through
      # Secrets Manager. boto3 gets its actual AWS credentials from the
      # instance's own IAM role (infra/lib/compute-stack.ts's SES grant), not
      # from any env var. Unset would fall back to console-logging emails —
      # never actually unset in production, since this line is a literal.
      SES_FROM_EMAIL: "Binx Portal <noreply@mail.binxportal.com>"
      # Optional — unset means replies to any transactional email fall back
      # to the noreply@ address above, which has no inbox. Set once a
      # monitored inbox exists, e.g. "support@binxportal.com".
      SES_REPLY_TO: ${SES_REPLY_TO:-}
      AWS_REGION: us-east-2
      # Cleanly off when unset (binx_api/core/config.py) — set SENTRY_DSN in
      # the binxportal/app Secrets Manager secret to turn it on.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: production
      # Every upload goes to S3 (binx_api/core/storage.py) — not a secret,
      # so a literal. boto3 authenticates via the instance's own IAM role,
      # granted on this bucket by infra/lib/uploads-stack.ts.
      UPLOAD_BUCKET: binxportal-uploads-prod-574247905173-us-east-2-an
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ops/ready')"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  web:
    image: ${WEB_IMAGE:?set in .env, e.g. <account>.dkr.ecr.<region>.amazonaws.com/binx-web:latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # NEXT_PUBLIC_* are already baked into this image at build time (see
      # apps/binx-web/Dockerfile) — APP_ORIGIN is the one thing binx-web
      # actually reads at runtime, for building absolute links server-side.
      APP_ORIGIN: https://www.binxportal.com
      NODE_ENV: production

  caddy:
    # Custom build (deploy/Dockerfile.caddy) with the Route53 DNS plugin —
    # needed for the wildcard *.binxportal.com cert's DNS-01 challenge; the
    # stock caddy:2-alpine image has no DNS provider module compiled in.
    image: ${CADDY_IMAGE:?set in .env, e.g. <account>.dkr.ecr.<region>.amazonaws.com/binx-caddy:latest}
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    # `edge` is how this Caddy reaches the staging stack's containers
    # (docker-compose.staging.yml) — it also fronts the staging hosts.
    networks:
      - default
      - edge
    volumes:
      # The whole directory, not just the Caddyfile: a single-file bind mount
      # pins the file's inode, so a deploy that replaces the Caddyfile would
      # leave the container reading the old one. Also picks up the optional
      # staging-auth.caddy that deploy/redeploy.sh generates.
      - ./deploy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config

networks:
  # Created by deploy/redeploy.sh (not by either compose project), so neither
  # stack's `down` can remove it out from under the other.
  edge:
    name: binxportal-edge
    external: true

volumes:
  redis-data:
  caddy-data:
  caddy-config:
