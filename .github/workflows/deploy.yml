# Builds the images for a commit and deploys them to STAGING. Production is a
# separate, manual step: promote.yml redeploys the exact images built here.
#
# Runs on every push to master that touches app code or the deploy config —
# relies on branch protection requiring binx-api CI / binx-web CI to have
# passed before a PR can merge, rather than re-running those suites here.
#
# Both environments live on the single binxportal EC2 instance (see
# docker-compose.prod.yml / docker-compose.staging.yml). No SSH:
# authenticates to AWS via OIDC (no stored AWS keys), pushes to ECR, then
# triggers deploy/redeploy.sh ON THE BOX via SSM Send-Command. See
# infra/lib/cicd-stack.ts for the IAM role this assumes and
# infra/lib/compute-stack.ts for the SSM instance profile attached to the box.
#
# No secrets stored in this repo's GitHub settings, either — the build-time
# values come from AWS Secrets Manager (binxportal/app for the production
# build, binxportal/staging for the staging one), the same place
# deploy/redeploy.sh gets everything the box needs at deploy time. See
# infra/lib/secrets-stack.ts and infra/lib/staging-stack.ts.

name: Deploy

on:
  push:
    branches: [master]
    paths:
      - "apps/binx-api/**"
      - "apps/binx-web/**"
      - "pnpm-lock.yaml"
      - "docker-compose.prod.yml"
      - "docker-compose.staging.yml"
      - "deploy/**"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"
      - ".github/actions/ssm-redeploy/**"

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2
  # Fixed by infra/lib/cicd-stack.ts's `roleName` — not a secret (only
  # assumable by a GitHub Actions OIDC token whose `sub` claim matches this
  # exact repo + branch, per that stack's trust policy).
  DEPLOY_ROLE_ARN: arn:aws:iam::574247905173:role/binxportal-github-deploy
  # Graviton (arm64) — see infra/lib/compute-stack.ts.
  INSTANCE_ID: i-0105be61fb01246d2

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # One API image serves both environments — everything it needs is
          # runtime config.
          - name: binx-api
            repository: binx-api
            dockerfile: apps/binx-api/Dockerfile
            tag-prefix: sha-
            cache-scope: binx-api
          # binx-web is built once per environment: NEXT_PUBLIC_* are inlined
          # at `next build` time (see apps/binx-web/Dockerfile). The
          # production image is built now, alongside staging's, so promoting
          # is a pure redeploy of this exact commit — no build in between.
          - name: binx-web (production)
            repository: binx-web
            dockerfile: apps/binx-web/Dockerfile
            tag-prefix: sha-
            cache-scope: binx-web
            secret-id: binxportal/app
            api-url: https://api.binxportal.com/
            site-url: https://www.binxportal.com
            sentry-environment: production
          - name: binx-web (staging)
            repository: binx-web
            dockerfile: apps/binx-web/Dockerfile
            tag-prefix: staging-sha-
            cache-scope: binx-web-staging
            secret-id: binxportal/staging
            api-url: https://api.staging.binxportal.com/
            site-url: https://staging.binxportal.com
            sentry-environment: staging
    name: build ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Fetch build-time values from Secrets Manager
        # File-based (secret-files, not secrets), so the value only ever
        # touches a local file on this ephemeral runner — never a workflow
        # expression, env var, or log line. NEXT_PUBLIC_SENTRY_DSN isn't
        # actually sensitive (Sentry DSNs are meant to be public), but it's
        # pulled from the same place for one source of truth; jq's `// empty`
        # means a missing key builds with Sentry cleanly off instead of
        # failing the step. The API build has no secret-id: it just gets an
        # empty key file its Dockerfile never mounts.
        id: secrets
        env:
          SECRET_ID: ${{ matrix.secret-id }}
        run: |
          : > /tmp/next_actions_key
          chmod 600 /tmp/next_actions_key
          if [ -n "$SECRET_ID" ]; then
            secret=$(aws secretsmanager get-secret-value --secret-id "$SECRET_ID" --region "$AWS_REGION" --query SecretString --output text)
            echo "$secret" | jq -r '.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY // empty' > /tmp/next_actions_key
            echo "sentry-dsn=$(echo "$secret" | jq -r '.NEXT_PUBLIC_SENTRY_DSN // empty')" >> "$GITHUB_OUTPUT"
            # Production must pin the key (see the Dockerfile); staging can
            # live with a per-build one if its secret doesn't set it.
            if [ "$SECRET_ID" = "binxportal/app" ] && [ ! -s /tmp/next_actions_key ]; then
              echo "::error::NEXT_SERVER_ACTIONS_ENCRYPTION_KEY is missing from binxportal/app"
              exit 1
            fi
          fi

      # The runner is amd64; QEMU lets buildx cross-build the arm64 images
      # the Graviton instance actually runs.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - id: tag
        run: echo "image=${{ steps.ecr.outputs.registry }}/${{ matrix.repository }}:${{ matrix.tag-prefix }}${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.tag.outputs.image }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ matrix.api-url }}
            NEXT_PUBLIC_SITE_URL=${{ matrix.site-url }}
            NEXT_PUBLIC_SENTRY_DSN=${{ steps.secrets.outputs.sentry-dsn }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=${{ matrix.sentry-environment }}
          # Same key on every build so an in-flight form submit against the
          # outgoing container doesn't fail post-deploy — see the Dockerfile.
          # File-based, from the step above — never a workflow expression.
          secret-files: |
            next_actions_key=/tmp/next_actions_key
          cache-from: type=gha,scope=${{ matrix.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache-scope }}

      - name: Clean up the fetched secret file
        if: always()
        run: rm -f /tmp/next_actions_key

      # Fails here, on the runner, rather than on the box — production's
      # Caddy serves both environments from this one file.
      - name: Validate the Caddyfile
        if: matrix.repository == 'binx-api'
        run: docker run --rm -v "$PWD/deploy:/etc/caddy:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Shared with promote.yml: only one deploy touches the box at a time.
    concurrency:
      group: binxportal-box
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/ssm-redeploy
        with:
          target: staging
          image-tag: ${{ steps.tag.outputs.tag }}
          instance-id: ${{ env.INSTANCE_ID }}

      - name: How to promote
        run: |
          {
            echo "Deployed \`${GITHUB_SHA::12}\` to https://staging.binxportal.com"
            echo
            echo "Promote it to production with:"
            echo
            echo "    gh workflow run promote.yml -f sha=${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
